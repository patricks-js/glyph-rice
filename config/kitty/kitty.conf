# glyph + user: configuração mesclada do Kitty

# Font Configuration
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Cursor & Window
cursor_shape          block
cursor_blink_interval 1
cursor_trail          0
background_opacity    1
window_padding_width  26 30
confirm_os_window_close 0
shell                 fish

# Scrollback & Terminal Features
scrollback_lines      3000
copy_on_select        yes
strip_trailing_spaces smart
shell_integration     enabled

# Tab Configuration
tab_bar_style powerline
tab_bar_align left

# Base Colors
foreground           #F2F2F2
background           #0E0E0E
cursor               #F2F2F2
cursor_text_color    #0E0E0E
selection_foreground #F2F2F2
selection_background #2A2A2A
url_color            #8C8C8C

color0  #0E0E0E
color1  #D71921
color2  #9BB59A
color3  #D9C38A
color4  #8EA3C2
color5  #B79BC2
color6  #8FB8B8
color7  #C9C9C9
color8  #4A4A4A
color9  #F0434B
color10 #B5CCB4
color11 #E8D6A8
color12 #AABBD4
color13 #CDB6D6
color14 #ABCDCD
color15 #F2F2F2

# cores geradas pelo Theme.apply()
include ~/.config/glyph/kitty.conf

# Copy
map ctrl+c copy_or_interrupt

# Search
map ctrl+f          launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f     launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up           scroll_page_up
map page_down         scroll_page_down
map ctrl+plus         change_font_size all +1.0
map ctrl+equal        change_font_size all +1.0
map ctrl+kp_add       change_font_size all +1.0
map ctrl+minus        change_font_size all -1.0
map ctrl+underscore   change_font_size all -1.0
map ctrl+kp_subtract  change_font_size all -1.0
map ctrl+0            change_font_size all 0
map ctrl+kp_0         change_font_size all 0
